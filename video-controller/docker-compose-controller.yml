# Start a video controller container to manage video recording for selenium nodes with a sidecar video recorder

# Environment variables:
# - NETWORK: the name of the docker network to connect the container to
# - FOLDER: the folder to save the recorded videos to
# - PORTS: port mappings for the video controller container (optional, default a localhost ephemeral port, format: [ip:]hostPort:containerPort)
# - CONTAINER_USER: the user to run the video controller container as (optional, default is root, format: uid[:gid])

# By default, the image is built from the source in ./app (run with up --build to rebuild it).
# To use the image published in GHCR instead, change the node service:
# - comment out the build key and its two lines (context and dockerfile)
# - set the image: ghcr.io/javiertuya/selema-video-controller-dev:dev (development image),
#   or ghcr.io/javiertuya/selema-video-controller:main (production image)
# - run with up --pull always (instead of --build), so that the latest version of the tag is used

name: selema-stack-controller
services:
  node:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: selema-video-controller
    container_name: selema-video-controller
    networks:
      - selenium
    ports:
      - ${PORTS:-127.0.0.1::4449}
    user: ${CONTAINER_USER:-root}
    restart: unless-stopped
    volumes:
      - ${FOLDER:?}:/app/videos
      - /var/run/docker.sock:/var/run/docker.sock
networks:
  # The services refer to this static key, the actual network is set by the environment variable
  selenium:
    external: true
    name: ${NETWORK:?}
