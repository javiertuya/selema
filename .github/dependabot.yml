version: 2
updates:
  - package-ecosystem: maven
    directories: 
      - "/java"
      - "/samples/samples-selema-junit4"
      - "/samples/samples-selema-junit5"
    schedule:
      interval: weekly
      day: "friday"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20

  # Core .NET dependencies (MSTest, NUnit and Selenium) are declared as private assets to prevent propagation to the client
  # and must be kept to lower versions to prevent deprecation warnings/errors in the clients
  # Issue #959
  # However, it is not possible to have these dependencies not updated by dependabot (even setting them as ignore in a directory), 
  # because SelemaTest depends transitively on Selema. When dependabot updates SelemaTest, updates Selema too.
  # NOTE: When publish a new release, set back the Selema core dependencies to the lower versions, in v4.0.0.0 they are:
  # MSTest.TestFramework 4.0.0, NUnit 3.14.0, Selenium.WebDriver 4.37.0
  # The version of NUnit is set the latest major version (v3) that is compatible with netstandard2.0.
  # Because of this, NUnit major updates (v4, v5...) are never proposed for SelemaTest (net10.0) and must be done manually:
  # the nuget updater checks compatibility against the union of the target frameworks of all projects in the directory
  # that use the package, including Selema (netstandard2.0), that is also discovered through the SelemaTest ProjectReference.
  # https://github.com/dependabot/dependabot-core/issues/12274 (related)
  - package-ecosystem: nuget
    directories: 
      - "/net"
      - "/samples/samples-selema-mstest"
      - "/samples/samples-selema-nunit"
    # The nuget updater creates several PRs with the same title for the core dependencies in different folders.
    # This causes that a PR that updates a dependency in folder A is closed by other PR that updates the same dependency 
    # in folder B, because they have the same title. 
    # To avoid this, we group the PRs and use group-by (new since Feb 2026), so that only one PR 
    # is created for each dependency, including the updates in multiple folders.
    # NOTE: the PRs of a group-by subgroup can not be refreshed: the "Rebase update" jobs fail with
    # "Dependency group <group>/<dependency> not found". Merge or close the PRs before the next scheduled run.
    # https://github.com/dependabot/dependabot-core/issues/14780
    groups:
      net-test-sdk:
        patterns:
          - "Microsoft.NET.Test.Sdk"
        group-by: dependency-name
      mstest:
        patterns:
          - "MSTest.*"
        group-by: dependency-name
      nunit:
        patterns:
          - "NUnit*"
        group-by: dependency-name
      selenium:
        patterns:
          - "Selenium.*"
        group-by: dependency-name
    schedule:
      interval: weekly
      day: "friday"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20

  - package-ecosystem: npm
    directory: "/video-controller/app"
    schedule:
      interval: weekly
      day: "friday"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
    # Do not rely on the auto heuristic: always bump the requirement in package.json, not only the lock
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 20
